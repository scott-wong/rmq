services:
  rmq:
    image: ghcr.io/scott-wong/rmq:4.4.0-rmq.2-tongsuo-openeuler
    hostname: rmq-single
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RMQ_GM_KEY_FILE: /etc/rabbitmq/gm.key
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rmq-data:/var/lib/rabbitmq
      - ./gm.key:/etc/rabbitmq/gm.key:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  rmq-data:
