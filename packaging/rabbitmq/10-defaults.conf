## DEFAULT SETTINGS ARE NOT MEANT TO BE TAKEN STRAIGHT INTO PRODUCTION
##
## RMQ deliberately differs from the upstream Docker image here:
## guest may authenticate only through a loopback interface.
## Create an explicit user through RabbitMQ configuration before exposing
## AMQP or the management UI beyond a trusted local network.
loopback_users.guest = true

## Send all logs to stdout/TTY for container log collection.
log.console = true
